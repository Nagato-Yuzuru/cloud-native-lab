# Shared Redis — single instance, no HA
architecture: standalone
auth:
  enabled: false
master:
  persistence:
    # RAM-backed via the tmpfs local-path storageClass (see bootstrap/storage/tmpfs-storage.yaml).
    enabled: true
    size: 512Mi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
