server:
  # Keep only 1 day of samples: data lives in RAM (PVC -> tmpfs, see
  # bootstrap/storage/tmpfs-storage.yaml), so short retention keeps the footprint tiny.
  retentionPeriod: 1d
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistentVolume:
    # PVC is RAM-backed via the tmpfs-mounted local-path storageClass — never hits the SSD.
    enabled: true
    size: 2Gi
    storageClass: "standard"
  scrape:
    enabled: true
    config:
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: 'victoriametrics'
          static_configs:
            - targets: ['localhost:8428']
